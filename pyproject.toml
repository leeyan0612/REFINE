[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refine-retinal"
version = "0.2.0"
description = "Compositional retinal image retrieval with CaSMO and Q-SAT"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.26", "safetensors>=0.4"]

[tool.setuptools.packages.find]
include = ["refine*"]
